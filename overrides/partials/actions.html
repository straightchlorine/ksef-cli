{#- "View source" goes to the page in the repository, not a raw download; edit_url comes from edit_uri. -#}
{% if page.edit_url and "content.action.view" in features %}
  <a href="{{ page.edit_url }}" title="{{ lang.t('action.view') }}" class="md-content__button md-icon">
    {% set icon = config.theme.icon.view or "material/file-eye-outline" %}
    {% include ".icons/" ~ icon ~ ".svg" %}
  </a>
{% endif %}
