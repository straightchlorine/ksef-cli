name: Site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs-en/**'
      - 'overrides/**'
      - 'hooks/**'
      - 'mkdocs.yml'
      - 'mkdocs.en.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: sitemap lastmod comes from git

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements-docs.txt

      # cairo for social cards
      - name: System libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libcairo2

      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -r requirements-docs.txt

      - name: Build PL and EN
        run: |
          .venv/bin/mkdocs build --strict -f mkdocs.yml
          .venv/bin/mkdocs build --strict -f mkdocs.en.yml

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Ping IndexNow
        continue-on-error: true
        run: |
          HOST=ksef.piotrkrzysztof.dev
          KEY=90d810c25c630c45122515d81f668d80

          sleep 45  # let the deployed site settle before IndexNow fetches the key file
          urls=$( (curl -fsS "https://$HOST/sitemap.xml"; curl -fsS "https://$HOST/en/sitemap.xml") | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | sed 's/.*/"&"/' | paste -sd, -)
          curl -fsS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/$KEY.txt\",\"urlList\":[$urls]}" \
            -o /dev/null -w "indexnow: HTTP %{http_code}\n"
